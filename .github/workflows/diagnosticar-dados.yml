name: Diagnosticar dados (sem gravar)

# HIS-111 (T3): baixa os CSVs da ANEEL e mostra o que a montagem do PR mudaria, sem gravar nada.
# O resumo sai na página da execução ($GITHUB_STEP_SUMMARY), no log do passo "Diagnosticar" e nas anotações.
# Só leitura: token com contents: read, sem credencial guardada, sem segredo, e o último passo confere que nada mudou.
# Gatilho pull_request (h8, R4 da seguranca): toda mudança na rotina ou no sucessoes.json mostra o diff das cidades no
# próprio PR. Nunca pull_request_target: o código do PR roda sem token de escrita nem segredo.
on:
  workflow_dispatch: {}
  pull_request:
    # packages/core e o lockfile mudam a montagem; sem eles o diagnóstico ficaria velho (R1 da seguranca).
    paths:
      - "packages/dados/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/diagnosticar-dados.yml"

permissions: {}

# Um grupo por PR: um PR não cancela o diagnóstico do outro.
concurrency:
  group: diagnosticar-dados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnosticar
        run: pnpm dados:diagnosticar
      - name: Nada mudou no repositório
        run: test -z "$(git status --porcelain --untracked-files=all)"
