name: Atualizar tarifas e bandeiras

# Baixa os dados abertos da ANEEL e do IBGE todo dia e grava em apps/web/public/dados.
# Só cria um commit quando algo mudou de verdade.
# Sem --forcar (HIS-111, h8): se uma barreira reclamar, nada é gravado e os dados do dia anterior ficam no ar. Quem
# quiser publicar mesmo assim roda `pnpm dados:atualizar --forcar` na própria máquina e abre um PR com o diff.
on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Atualizar dados
        run: |
          set -o pipefail
          pnpm dados:atualizar 2>&1 | tee atualizacao.log
      - name: Publicar resumo da atualização
        if: always()
        run: |
          # Mostra o resumo como anotação (aparece na página da execução e pode ser lido pela API).
          if [ -f atualizacao.log ]; then
            # Escapa %, \r e \n, nessa ordem, para nada do log virar comando do runner (R2; ressalva 4 da seguranca na 003a).
            resumo=$(tail -n 120 atualizacao.log | cut -c1-400 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=Resumo da atualização::${resumo}"
          fi
      - name: Salvar no repositório
        run: |
          if git diff --quiet -- apps/web/public/dados; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/dados
          git commit -m "dados: atualiza tarifas e bandeiras da ANEEL"
          git push
